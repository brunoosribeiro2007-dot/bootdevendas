# ==============================================================================
# RENDER.YAML - CONFIGURAÇÃO DE DEPLOY DO BOT NO RENDER (MULTI-NICHO & MULTI-GRUPOS)
# ==============================================================================
# Define o serviço Web em container Docker, variáveis de ambiente e agendamentos cron.
# Utiliza IDs diretos e imutáveis dos grupos do WhatsApp para zero ambiguidades.
# ==============================================================================

services:
  - type: web
    name: ml-afiliados-bot
    region: frankfurt
    env: docker
    plan: free
    healthCheckPath: /health # Rota de verificação periódica de integridade para uptime

    envVars:
      # Porta do servidor HTTP
      - key: PORT
        value: 3000

      # Ambiente de execução Node.js
      - key: NODE_ENV
        value: production

      # Credenciais de acesso ao Painel Web (Dashboard)
      - key: ADMIN_USER
        value: "admin"
      - key: ADMIN_PASS
        sync: false

      # ------------------------------------------------------------------------
      # CONFIGURAÇÃO DE NICHO E IA
      # ------------------------------------------------------------------------
      # Nicho ativo: "multi" (Captura e publica para Casa E PC Gamer simultaneamente)
      - key: NICHE
        value: "multi"

      # Desativa dados de seed falsos/estáticos para garantir 100% de promoções reais
      - key: ENABLE_SEED_PRODUCTS
        value: "false"

      # Chave de Inteligência Artificial Gemini (Curadoria Dinâmica e Variação de Copy)
      - key: GEMINI_API_KEY
        sync: false

      # ------------------------------------------------------------------------
      # DESTINOS DO WHATSAPP (IDs EXATOS E IMUTÁVEIS DOS CHATS REAIS)
      # ------------------------------------------------------------------------
      # Grupo Casa: "OFERTAS LAR 🏡" (Chat Real dos membros)
      - key: WHATSAPP_GROUP_CASA
        value: "120363429298492381@g.us"

      # Grupo PC Gamer: "Infomarket 🎮" (Chat Real dos membros)
      - key: WHATSAPP_GROUP_PC_GAMER
        value: "120363429098602670@g.us"

      # Destino Geral: Envia simultaneamente para os dois grupos configurados
      - key: WHATSAPP_TARGET_GROUP
        value: "120363429298492381@g.us, 120363429098602670@g.us"

      # Canais Oficiais (Deixados vazios pois o envio é em Grupos de Comunidade)
      - key: WHATSAPP_TARGET_CHANNEL
        value: ""
      - key: WHATSAPP_CHANNEL_CASA
        value: ""
      - key: WHATSAPP_CHANNEL_PC_GAMER
        value: ""

      # Número de WhatsApp para testes diretos (Fallback)
      - key: WHATSAPP_TARGET_NUMBER
        value: "5569984520192"

      # ------------------------------------------------------------------------
      # FILTROS DE QUALIDADE DE OFERTAS
      # ------------------------------------------------------------------------
      - key: MIN_REVIEWS
        value: "0"
      - key: MIN_RATING
        value: "4.0"
      - key: MIN_DISCOUNT_PERCENT
        value: "5"
      - key: REQUIRE_TRUSTED_SELLER
        value: "true"

      # ------------------------------------------------------------------------
      # BANCO DE DADOS & AFILIADOS
      # ------------------------------------------------------------------------
      # URL de conexão do PostgreSQL (Supabase) - configurado nas secrets do Render
      - key: DATABASE_URL
        sync: false

      # Tag de afiliado do Mercado Livre
      - key: ML_AFFILIATE_TAG
        value: "bv20260330080614"

      # Cookies oficiais da conta de afiliado para geração 100% garantida do link meli.la
      - key: ML_COOKIE_STRING
        value: "cp=76890000; hide-cookie-banner=3301797589-COOKIE_PREFERENCES_ALREADY_SET; cookiesPreferencesLoggedFallback=%7B%22userId%22%3A3301797589%2C%22categories%22%3A%7B%22advertising%22%3Atrue%2C%22functionality%22%3Atrue%2C%22performance%22%3Atrue%2C%22traceability%22%3Atrue%7D%7D; cookiesPreferencesLogged=%7B%22userId%22%3A3301797589%2C%22categories%22%3A%7B%22advertising%22%3Atrue%2C%22functionality%22%3Atrue%2C%22performance%22%3Atrue%2C%22traceability%22%3Atrue%7D%7D; cookiesPreferencesNotLogged=%7B%22categories%22%3A%7B%22advertising%22%3Atrue%2C%22functionality%22%3Atrue%2C%22performance%22%3Atrue%2C%22traceability%22%3Atrue%7D%7D; ssid=ghy-070211-naArCx0meW6bjZzt0RVKWusDeRyyzM-__-3301797589-__-1877699609409--RRR_0-RRR_0; _gcl_au=1.1.1655135422.1783005118; _csrf=SQiMoXJ2V7o1IyRFvMBpKrec; orgnickp=BV20260330080614; _d2id=786ebc68-7f6c-4a54-bb83-e860a8ca0eaf; _hjSession_1160754=eyJpZCI6Ijk1ZTI1MzZjLTFlOTAtNDM2Yy1hMTJhLTMyOWEzZWYwNDIyNSIsImMiOjE3ODMwMDUxMTg5OTIsInMiOjAsInIiOjAsInNiIjowLCJzciI6MCwic2UiOjAsImZzIjoxLCJzcCI6MH0=; _fbp=fb.2.1783005118749.10617763184172618; NSESSIONID_qrtsid=s%3Al2bSE-ygO8DmZRJF_u3C2ar3DWr3M2wW.Ru1lALsBIVjF0Vseffsq23WMhaLLyII5nWq49iTP1TQ; orguserid=0HHtdd0h4h974; ftid=3xkk27u5qzq5DHrCcWNb2w3Bwil7yfgT-1783005120851; c_ZCvNdd=1; _hjSessionUser_1160754=eyJpZCI6ImQ3MTNiY2IwLWJmNGYtNTc5Ny1iZTk3LWY1YjUzMDNjZjQ1NyIsImNyZWF0ZWQiOjE3ODMwMDUxMTg5OTEsImV4aXN0aW5nIjpmYWxzZX0=; orguseridp=3301797589; _mldataSessionId=f9bac547-9277-43e7-b314-385c4e336a13"

      # Palavras-chave de busca
      - key: ML_SEARCH_KEYWORD
        value: "Panelas, frigideiras, Talheres, pratos, copos, Air Fryer, Liquidificador, Micro-ondas, Cafeteira, Potes herméticos, Porta temperos, Tábua de corte, Vassoura, Rodo, Mop esfregão, Balde, Panos de limpeza, Sabão líquido, Detergente, Desinfetante, Água sanitária, Amaciante, Esponjas, Luvas de limpeza, Máquina de lavar, Varal, Ferro de passar, Tábua de passar, Cesto de roupa, Organizadores de roupa, Sofá, Rack painel TV, Televisão, Tapete sala, Cortina, Ventilador, Cama colchão, Travesseiros, Lençóis, Cobertores, Guarda-roupa, Cabides, Chuveiro, Toalhas banho, Tapete de banheiro, Lixeira banheiro, Espelho banheiro, Porta sabonete, Caixas organizadoras, Organizadores de gaveta, Prateleiras, Nichos parede, Carrinho com rodinhas, Quadros decorativos, Luminárias decorativas, Plantas artificiais, Espelhos decorativos, Velas decorativas, Almofadas, Cortinas estilizadas, Tapetes decorativos"

      # Frequência do job de captura de novas ofertas (a cada 5 minutos)
      - key: CRON_CAPTURE_SCHEDULE
        value: "*/5 * * * *"

      # Frequência do job de publicação de ofertas no WhatsApp (a cada 3 minutos para ambos os grupos)
      - key: CRON_PUBLISH_SCHEDULE
        value: "*/3 * * * *"

      # ------------------------------------------------------------------------
      # OAUTH MERCADO LIVRE
      # ------------------------------------------------------------------------
      - key: ML_CLIENT_ID
        value: "7921110595606583"
      - key: ML_CLIENT_SECRET
        sync: false
      - key: ML_REDIRECT_URI
        value: "https://ml-afiliados-bot-f1w7.onrender.com/auth/callback"

      # ------------------------------------------------------------------------
      # SHOPEE (OPCIONAL)
      # ------------------------------------------------------------------------
      - key: USE_SHOPEE
        value: "true"
      - key: SHOPEE_APP_ID
        sync: false
      - key: SHOPEE_SECRET
        sync: false
      - key: SHOPEE_AFFILIATE_TAG
        sync: false
