# ==============================================================================
# RENDER.YAML - CONFIGURAÇÃO DE DEPLOY DO BOT NO RENDER
# ==============================================================================
# Define o serviço Web em container Docker, variáveis de ambiente e agendamentos cron.
# ==============================================================================

services:
  - type: web
    name: ml-afiliados-bot
    region: frankfurt
    env: docker
    plan: free
    healthCheckPath: /health # Rota de verificação periódica de integridade para uptime

    envVars:
      # Porta do servidor HTTP
      - key: PORT
        value: 3000

      # Ambiente de execução Node.js
      - key: NODE_ENV
        value: production

      # URL de conexão do PostgreSQL (Supabase) - configurado nas secrets do Render
      - key: DATABASE_URL
        sync: false

      # Número de WhatsApp para testes diretos
      - key: WHATSAPP_TARGET_NUMBER
        value: "5569984520192"

      # Canal do WhatsApp onde as ofertas serão postadas
      - key: WHATSAPP_TARGET_CHANNEL
        value: "OfertaLar"

      # Nome exato do grupo do WhatsApp onde as ofertas serão postadas
      - key: WHATSAPP_TARGET_GROUP
        value: "OfertaLar"

      # Tag de afiliado do Mercado Livre - configurada nas secrets do Render
      - key: ML_AFFILIATE_TAG
        sync: false

      # Lista de palavras-chave do nicho Casa e Eletrodomésticos para captura rotativa
      - key: ML_SEARCH_KEYWORD
        value: "Panelas, frigideiras, Talheres, pratos, copos, Air Fryer, Liquidificador, Micro-ondas, Cafeteira, Potes herméticos, Porta temperos, Tábua de corte, Vassoura, Rodo, Mop esfregão, Balde, Panos de limpeza, Sabão líquido, Detergente, Desinfetante, Água sanitária, Amaciante, Esponjas, Luvas de limpeza, Máquina de lavar, Varal, Ferro de passar, Tábua de passar, Cesto de roupa, Organizadores de roupa, Sofá, Rack painel TV, Televisão, Tapete sala, Cortina, Ventilador, Cama colchão, Travesseiros, Lençóis, Cobertores, Guarda-roupa, Cabides, Chuveiro, Toalhas banho, Tapete de banheiro, Lixeira banheiro, Espelho banheiro, Porta sabonete, Caixas organizadoras, Organizadores de gaveta, Prateleiras, Nichos parede, Carrinho com rodinhas, Quadros decorativos, Luminárias decorativas, Plantas artificiais, Espelhos decorativos, Velas decorativas, Almofadas, Cortinas estilizadas, Tapetes decorativos"

      # Frequência do job de captura de novas ofertas (a cada 10 minutos)
      - key: CRON_CAPTURE_SCHEDULE
        value: "*/10 * * * *"

      # Frequência do job de publicação de ofertas no WhatsApp (a cada 5 minutos)
      - key: CRON_PUBLISH_SCHEDULE
        value: "*/5 * * * *"
